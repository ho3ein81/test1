<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تست سرعت تایپ</title>
  <script src="script.js" async></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style26.css">
</head>
<body>
  <header class="masthead">
    <h1>تست سنجش سرعت تایپ</h1>
  </header>

  <main class="main">
    <article class="intro">
      <p dir="rtl">
        فرایند سنجش سرعت تایپ بدین گونه است که با شروع تایپ کاربر، تایمر شروع به شمارش زمان می‌کند و با تایپ هر حرف، مطابقت متن کاربر با متن نمایش داده شده چک می‌شود.
      </p>
    </article>

    <section class="test-area">
      <div class="pattern">متن الگو :</div>

      <div id="origin-text">
        <p>The text to test.</p>
      </div>

      <div class="test-wrapper">
        <textarea id="test-area" name="textarea" rows="6" placeholder="با تایپ اولین حرف تایمر شمارش را آغاز می‌کند"></textarea>
      </div>

      <div class="meta">
        <section id="clock">
          <div class="timer">00:00:00</div>
        </section>

        <button id="reset">از نو</button>
      </div>
    </section>
  </main>
  <script src="script26.js"></script>
</body>
</html>
